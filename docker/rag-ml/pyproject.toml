[project]
name = "rag-ml"
version = "2.0.0"
description = "Knowledge RAG ML Service — ONNX Runtime FP16 embedding + reranker sidecar"
requires-python = ">=3.12"
# Runtime dependencies (the ONNX Runtime service). The exporter stage of the Dockerfile
# installs torch/transformers/onnx itself; torch is intentionally NOT a runtime dependency.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "numpy>=1.26,<2.0",
    "onnxruntime==1.20.1",
    "transformers==4.46.3",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
