limit_req_zone $binary_remote_addr zone=chatbot_limit:10m rate=30r/m;

# Docker service IPs change whenever Compose recreates a container. Variable
# proxy_pass targets are resolved by Docker DNS at request time, preventing a
# healthy replacement app/chat-stream from being hidden behind a stale 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    set $php_app_upstream app:8080;
    set $chat_stream_upstream chat-stream:8090;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(env|git|svn|hg) {
        return 404;
    }

    location ~* /(composer\.(json|lock)|phpunit\.xml|phpstan\.neon|Dockerfile|docker-compose.*\.ya?ml)$ {
        return 404;
    }

    # The application bridge trusts service headers and is never public.
    location ^~ /api/internal/mcp {
        return 404;
    }

    location = /api/chatbot {
        limit_req zone=chatbot_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://$php_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Native LLM token stream. Disable every proxy buffer so each NDJSON
    # delta can reach the WebSocket gateway as soon as PHP flushes it.
    location = /api/chatbot/stream {
        limit_req zone=chatbot_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://$php_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }

    # The browser receives validated chatbot output as WebSocket events. The
    # gateway is internal-only; this is the sole public upgrade endpoint.
    location = /ws/chatbot {
        limit_req zone=chatbot_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://$chat_stream_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://$php_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
