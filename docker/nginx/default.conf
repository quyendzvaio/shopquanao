limit_req_zone $binary_remote_addr zone=chatbot_limit:10m rate=30r/m;

upstream php_app {
    server app:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(env|git|svn|hg) {
        return 404;
    }

    location ~* /(composer\.(json|lock)|phpunit\.xml|phpstan\.neon|Dockerfile|docker-compose.*\.ya?ml)$ {
        return 404;
    }

    # The application bridge trusts service headers and is never public.
    location ^~ /api/internal/mcp {
        return 404;
    }

    location = /api/chatbot {
        limit_req zone=chatbot_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://php_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://php_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
