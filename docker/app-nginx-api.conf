# The application uses a single REST front controller. This exact prefix also
# ensures that PHP source under /api is never served as a static file.
location ^~ /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_NAME /api/index.php;
    fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
    fastcgi_pass 127.0.0.1:9000;
    # Forward native LLM NDJSON deltas immediately instead of waiting for the
    # FastCGI buffer to fill. This is required by /api/chatbot/stream.
    fastcgi_buffering off;
    fastcgi_buffers 8 8k;
    fastcgi_buffer_size 8k;
    fastcgi_read_timeout 90s;
}
