services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shop_quan_ao_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 8

  app:
    image: ${APP_IMAGE:-shop_quan_ao-app:latest}
    build:
      context: .
    container_name: shop_quan_ao_app
    env_file: .env
    restart: unless-stopped
    expose:
      - "80"
    environment:
      DB_HOST: db
      DB_NAME: shop_db
      DB_USER: shop_user
      DB_PASS: ${DB_PASS:-shop_pass}
      DB_CONNECT_RETRIES: 30
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-25}
      RERANKER_URL: http://reranker:8000
      RAG_ML_URL: http://rag-ml:8000
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_COLLECTION: shop_knowledge_v2
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-rag_ml}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bkai-foundation-models/vietnamese-bi-encoder}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      KNOWLEDGE_RERANKER_MODEL: ${KNOWLEDGE_RERANKER_MODEL:-itdainb/PhoRanker}
      RAG_EMBED_TIMEOUT: ${RAG_EMBED_TIMEOUT:-8}
      RAG_RERANK_TIMEOUT: ${RAG_RERANK_TIMEOUT:-6}
      KNOWLEDGE_HYBRID_CANDIDATES: ${KNOWLEDGE_HYBRID_CANDIDATES:-12}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-0.15}
      REDIS_PREFIX: "shop:"
      CLIENT_CACHE_TTL: ${CLIENT_CACHE_TTL:-60}
      CLIENT_CACHE_STALE_TTL: ${CLIENT_CACHE_STALE_TTL:-30}
      CHATBOT_TOOL_TRANSPORT: ${CHATBOT_TOOL_TRANSPORT:-mcp}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-local-dev-mcp-secret-change-in-production}
      MCP_STDIO_NODE: /usr/bin/node
      MCP_STDIO_SCRIPT: /opt/mcp-server/dist/stdio.js
      SHOP_INTERNAL_URL: http://127.0.0.1/api/internal/mcp
      # The internal call includes extraction (up to LLM_TIMEOUT) plus bounded
      # Product Search. Keep the child deadline below the PHP MCP deadline.
      MCP_REQUEST_TIMEOUT_MS: ${MCP_REQUEST_TIMEOUT_MS:-80000}
      MCP_REQUEST_TIMEOUT: ${MCP_REQUEST_TIMEOUT:-85}
      FINDMINE_ENABLED: ${FINDMINE_ENABLED:-false}
      FINDMINE_DEMO_ENABLED: ${FINDMINE_DEMO_ENABLED:-false}
      FINDMINE_DEMO_MODE: ${FINDMINE_DEMO_MODE:-false}
      FASHION_PROVIDER: ${FASHION_PROVIDER:-findmine_demo}
      FINDMINE_LIVE_VERIFIED: ${FINDMINE_LIVE_VERIFIED:-false}
      FINDMINE_API_URL: ${FINDMINE_API_URL:-https://api.findmine.com}
      FINDMINE_APP_ID: ${FINDMINE_APP_ID:-}
      FINDMINE_API_VERSION: ${FINDMINE_API_VERSION:-v3}
      FINDMINE_DEFAULT_REGION: ${FINDMINE_DEFAULT_REGION:-us}
      FINDMINE_DEFAULT_LANGUAGE: ${FINDMINE_DEFAULT_LANGUAGE:-en}
      FINDMINE_MCP_NODE: /usr/bin/node
      FINDMINE_MCP_SCRIPT: /opt/findmine-mcp/build/index.js
      FINDMINE_STARTUP_TIMEOUT_MS: ${FINDMINE_STARTUP_TIMEOUT_MS:-5000}
      FINDMINE_REQUEST_TIMEOUT_MS: ${FINDMINE_REQUEST_TIMEOUT_MS:-15000}
      FINDMINE_RETRY_ATTEMPTS: ${FINDMINE_RETRY_ATTEMPTS:-1}
      FINDMINE_PRODUCT_IDENTIFIER_KEY: ${FINDMINE_PRODUCT_IDENTIFIER_KEY:-product_id}
      FINDMINE_COLOR_IDENTIFIER_KEY: ${FINDMINE_COLOR_IDENTIFIER_KEY:-product_color_id}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker:
        condition: service_started
      rag-ml:
        condition: service_started
      qdrant:
        condition: service_started

  fashion-outbox-publisher:
    image: ${APP_IMAGE:-shop_quan_ao-app:latest}
    container_name: shop_quan_ao_fashion_outbox_publisher
    restart: unless-stopped
    env_file: .env
    command: ["php", "scripts/publish_fashion_outbox.php"]
    environment:
      DB_HOST: db
      DB_NAME: shop_db
      DB_USER: shop_user
      DB_PASS: ${DB_PASS:-shop_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
      FASHION_EVENT_STREAM: ${FASHION_EVENT_STREAM:-fashion:events}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  fashion-event-consumer:
    image: ${APP_IMAGE:-shop_quan_ao-app:latest}
    container_name: shop_quan_ao_fashion_event_consumer
    restart: unless-stopped
    env_file: .env
    command: ["php", "scripts/consume_fashion_events.php"]
    environment:
      DB_HOST: db
      DB_NAME: shop_db
      DB_USER: shop_user
      DB_PASS: ${DB_PASS:-shop_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
      FASHION_EVENT_STREAM: ${FASHION_EVENT_STREAM:-fashion:events}
      FASHION_EVENT_GROUP: ${FASHION_EVENT_GROUP:-proactive-styling}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  reranker:
    build:
      context: docker/reranker
      dockerfile: Dockerfile
    container_name: shop_quan_ao_reranker
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 12
    # No model warmup needed — lightweight TF-IDF sidecar.
    # No GPU needed — CPU inference only.

  rag-ml:
    build:
      context: docker/rag-ml
      dockerfile: Dockerfile
    container_name: shop_quan_ao_rag_ml
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bkai-foundation-models/vietnamese-bi-encoder}
      KNOWLEDGE_RERANKER_MODEL: ${KNOWLEDGE_RERANKER_MODEL:-itdainb/PhoRanker}
      RAG_ML_DEVICE: ${RAG_ML_DEVICE:-cpu}
      RAG_ML_WARMUP_ON_START: ${RAG_ML_WARMUP_ON_START:-false}
      RAG_ML_MAX_TEXTS: 64
      RAG_ML_MAX_RERANK_TEXTS: ${RAG_ML_MAX_RERANK_TEXTS:-12}
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
    expose:
      - "8000"
    volumes:
      - hf_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 8

  db:
    image: mariadb:10.11
    container_name: shop_quan_ao_db
    env_file: .env
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_pass}
      MARIADB_DATABASE: shop_db
      MARIADB_USER: shop_user
      MARIADB_PASSWORD: ${DB_PASS:-shop_pass}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/shop_db.sql:/docker-entrypoint-initdb.d/01-shop_db.sql:ro
      - ./docker/mariadb-ft.cnf:/etc/mysql/conf.d/mariadb-ft.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: shop_quan_ao_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: shop_quan_ao_qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: shop_quan_ao_phpmyadmin
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${PMA_PASSWORD:-root_pass}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  qdrant_data:
  hf_cache:
