name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  # ============================================================
  # Job 1: Code Quality (lint + static analysis)
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit, phpcs

      - name: Validate composer
        run: composer validate --strict || echo "⚠️ composer.json not strict"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP Lint
        run: |
          ERRORS=0
          while IFS= read -r f; do
            php -l "$f" 2>/dev/null | grep -q "No syntax errors" || { echo "❌ $f"; ERRORS=$((ERRORS+1)); }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './test-evidence/*' \
            -not -path './reports/*' -not -path './.codex/*' -not -path './.git/*')
          [ "$ERRORS" -eq 0 ] && echo "✅ All PHP syntax OK" || exit 1

      - name: PHPCS (PSR-12)
        run: |
          vendor/bin/phpcs --standard=PSR12 --extensions=php \
            --ignore=test-evidence,reports,.codex,.agents,vendor,tests \
            --error-severity=1 --warning-severity=0 . || echo "⚠️ Style issues (non-blocking)"

      - name: Python syntax check (reranker)
        run: |
          python3 -m py_compile docker/reranker/app.py && echo "✅ Python syntax OK"

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Unit Tests
        run: |
          vendor/bin/phpunit --testsuite=Unit --colors=always --display-warnings
        env:
          APP_ENV: test

  # ============================================================
  # Job 3: Integration Tests (with MariaDB)
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_pass
          MARIADB_DATABASE: shop_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -u root -proot_pass 2>/dev/null && break
            sleep 1
          done

      - name: Import schema
        run: |
          mysql -h127.0.0.1 -u root -proot_pass shop_test < sql/shop_db.sql 2>/dev/null || \
            echo "⚠️ Schema import skipped"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: shop_test
          DB_USER: root
          DB_PASS: root_pass
        run: |
          vendor/bin/phpunit --testsuite=Integration --colors=always --display-warnings

  # ============================================================
  # Job 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for secrets..."
          RESULTS=$(grep -rn "sk-\|AKIA\|api_key\|api_secret\|password\s*=" \
            --include="*.php" --include="*.yml" --include="*.yaml" \
            --include="*.env" --include="*.json" --include="*.sql" \
            . 2>/dev/null | \
            grep -v "password_hash\|password_verify\|getenv\|\$_ENV\|\$_SERVER" | \
            grep -v "vendor/\|test-evidence/\|reports/\|\.git/\|node_modules/\|postman/" | \
            grep -v "password\s*=>\s*''\|password\s*=>\s*null" | \
            grep -v "MARIADB_ROOT_PASSWORD\|MARIADB_PASSWORD\|MARIADB_USER" | \
            grep -v '"password"\s*$' | \
            grep -v '${.*:-' | \
            head -20 || true)

          if [ -n "$RESULTS" ]; then
            echo "❌ Potential secrets leaked:"
            echo "$RESULTS"
            exit 1
          else
            echo "✅ No secrets detected"
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'vendor,test-evidence,reports,.git,node_modules,postman'

  # ============================================================
  # Job 5: Docker Build
  # ============================================================
  docker:
    name: Docker Build
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shop-quan-ao:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build reranker image
        run: |
          docker build -t shop-quan-ao-reranker:ci-${{ github.sha }} ./docker/reranker

      - name: Scan app image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shop-quan-ao:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Scan reranker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shop-quan-ao-reranker:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  # ============================================================
  # Job 6: Deploy to Production (main/master only)
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [unit-tests, integration-tests, security, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '✅ SSH connection OK' && uname -a"

      - name: Deploy application
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'DEPLOYEOF'
            set -e

            REPO_DIR="${{ secrets.DEPLOY_PATH || '/opt/shop_quan_ao' }}"
            echo "🚀 Deploying to $REPO_DIR"

            # 1. Pull latest code
            cd "$REPO_DIR"
            git pull origin main

            # 2. Create .env if not exists (secrets từ GitHub Actions)
            if [ ! -f .env ]; then
              cat > .env << ENVEOF
LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'deepseek' }}
LLM_API_KEY=${{ secrets.LLM_API_KEY }}
LLM_BASE_URL=${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
LLM_MODEL=${{ secrets.LLM_MODEL || 'deepseek-chat' }}
LLM_TIMEOUT=${{ secrets.LLM_TIMEOUT || '60' }}
MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}
DB_PASS=${{ secrets.DB_PASS }}
PMA_PASSWORD=${{ secrets.PMA_PASSWORD || '' }}
RERANKER_URL=http://reranker:8000
ENVEOF
              echo "✅ Created .env from secrets"
            fi

            # 3. Pull latest images & rebuild
            docker compose pull
            docker compose build --no-cache reranker
            docker compose build app

            # 4. Graceful restart
            docker compose up -d --force-recreate --remove-orphans

            # 5. Health check
            echo "⏳ Waiting for services..."
            sleep 5
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/api/products?limit=1 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ App healthy (HTTP $STATUS)"
                break
              fi
              echo "   Attempt $i/30 — waiting..."
              sleep 3
            done

            # 6. Verify reranker
            curl -sf http://localhost:8001/health && echo "✅ Reranker healthy" || echo "⚠️ Reranker still warming up"

            # 7. Cleanup old images
            docker image prune -f

            echo "✅ Deployment complete"
DEPLOYEOF

      - name: Deployment summary
        run: |
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | https://${{ secrets.DEPLOY_HOST }}:8090 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployer | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed for commit ${{ github.sha }} by ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
