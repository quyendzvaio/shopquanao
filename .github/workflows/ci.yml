name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  # ============================================================
  # Job 1: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit, phpcs

      - name: Validate composer
        run: composer validate --strict || echo "⚠️ composer.json not strict"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP Lint
        run: |
          ERRORS=0
          while IFS= read -r f; do
            php -l "$f" 2>/dev/null | grep -q "No syntax errors" || { echo "❌ $f"; ERRORS=$((ERRORS+1)); }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './test-evidence/*' \
            -not -path './reports/*' -not -path './.codex/*' -not -path './.git/*')
          [ "$ERRORS" -eq 0 ] && echo "✅ All PHP syntax OK" || exit 1

      - name: PHPCS (PSR-12)
        run: |
          vendor/bin/phpcs --standard=PSR12 --extensions=php \
            --ignore=test-evidence,reports,.codex,.agents,vendor,tests \
            --error-severity=1 --warning-severity=0 . || echo "⚠️ Style issues (non-blocking)"

      - name: Python lint (reranker)
        run: |
          python3 -m py_compile docker/reranker/app.py && echo "✅ app.py syntax OK"

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit --testsuite=Unit --colors=always --display-warnings
        env:
          APP_ENV: test

  # ============================================================
  # Job 3: Integration Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_pass
          MARIADB_DATABASE: shop_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -u root -proot_pass 2>/dev/null && break
            sleep 1
          done

      - name: Import schema
        run: sed '/^CREATE DATABASE/d;/^USE /d' sql/shop_db.sql | mysql -h127.0.0.1 -u root -proot_pass shop_test

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: shop_test
          DB_USER: root
          DB_PASS: root_pass
        run: vendor/bin/phpunit --testsuite=Integration --colors=always --display-warnings

  # ============================================================
  # Job 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for real secrets (API keys, tokens, private keys)..."
          # Only flag actual secret STRINGS — NOT PHP variable names
          #   sk-[a-z0-9]{20,}     → API keys
          #   -----BEGIN           → private keys
          #   ghp_xxx / github_pat → GitHub tokens
          SECRETS=$(grep -rnP '(?<![-\$>])sk-[a-z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{85}|-----BEGIN\s+(RSA|OPENSSH|EC|DSA)\s+PRIVATE\s+KEY-----' \
            --include='*.php' --include='*.py' --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.json' --include='*.md' \
            . 2>/dev/null | grep -v '.git/' | grep -v 'vendor/' || true)
          if [ -n "$SECRETS" ]; then
            echo "❌ Secrets leaked:"
            echo "$SECRETS"
            exit 1
          fi
          echo "✅ No secrets found"

      - name: Check for hardcoded passwords
        run: |
          echo "ℹ️  Checking for hardcoded passwords in auth files..."
          # Flag literal password === compares with real values
          BAD=$(grep -rnP "password\s*===\s*'[^']{4,}'" \
            --include='*.php' \
            . 2>/dev/null | grep -v '.git/' | grep -v 'vendor/' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Hardcoded password found:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ No hardcoded passwords"

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v $PWD:/src aquasecurity/trivy:latest fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --skip-dirs vendor \
            --skip-dirs .git \
            /src || echo "⚠️ Trivy scan done"

  # ============================================================
  # Job 5: Docker Build (app + reranker)
  # ============================================================
  docker:
    name: Docker Build
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build app image
        run: |
          docker build -t shop-quan-ao:ci-${{ github.sha }} .
          docker tag shop-quan-ao:ci-${{ github.sha }} shop-quan-ao:ci-latest

      - name: Build reranker image
        run: |
          docker build -t shop-reranker:ci-${{ github.sha }} docker/reranker/
          docker tag shop-reranker:ci-${{ github.sha }} shop-reranker:ci-latest

      - name: Scan app image
        run: |
          docker run --rm aquasecurity/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            shop-quan-ao:ci-${{ github.sha }} || echo "⚠️ Trivy scan done"

      - name: Scan reranker image
        run: |
          docker run --rm aquasecurity/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            shop-reranker:ci-${{ github.sha }} || echo "⚠️ Trivy scan done"

  # ============================================================
  # Job 6: Deploy to Production (main/master only)
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [unit-tests, integration-tests, security, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy via SSH
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ secrets.DEPLOY_PATH }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: GITHUB_TOKEN,REPO
          script: |
            set -e
            REPO_PATH="$REPO"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
            if [ "${#GITHUB_TOKEN}" -lt 10 ]; then
              echo "❌ GITHUB_TOKEN missing — check DEPLOY_GITHUB_TOKEN or GITHUB_TOKEN secret"
              exit 1
            fi

            # Install Docker if missing
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker "$USER" || true
            fi

            # Free disk aggressively
            echo "=== Disk before cleanup ==="
            df -h / | tail -1
            # Keep build cache warm by default. Only remove stopped containers and dangling images.
            docker container prune -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            echo "=== Disk after cleanup ==="
            df -h / | tail -1

            # Clone or pull repo
            if [ ! -d "$REPO_PATH" ]; then
              echo "Cloning ${{ github.repository }}..."
              git clone "$REPO_URL" "$REPO_PATH"
            fi

            cd "$REPO_PATH"
            git stash --include-untracked || true
            git remote set-url origin "$REPO_URL"

            # Detect default branch
            echo "Fetching origin..."
            git fetch origin --prune 2>&1 || true
            DEFAULT_BRANCH=$(git remote show origin 2>/dev/null | grep "HEAD branch" | cut -d" " -f5 || echo "")
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH="main"
            fi
            echo "Branch: $DEFAULT_BRANCH"

            # Hard reset
            git fetch origin "$DEFAULT_BRANCH"
            git checkout "$DEFAULT_BRANCH" 2>/dev/null || git checkout -b "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"
            echo "✅ Repo: $(git rev-parse --short HEAD)"

            # Write .env
            echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'deepseek' }}" > .env
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> .env
            echo "LLM_BASE_URL=${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}" >> .env
            echo "LLM_MODEL=${{ secrets.LLM_MODEL || 'deepseek-chat' }}" >> .env
            echo "LLM_TIMEOUT=${{ secrets.LLM_TIMEOUT || '60' }}" >> .env
            echo "MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}" >> .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
            echo "PMA_PASSWORD=${{ secrets.PMA_PASSWORD || '' }}" >> .env
            echo "RERANKER_URL=http://reranker:8000" >> .env
            echo ".env written ($(wc -l < .env) lines)"

            # Build images (cache-aware)
            echo "Building images..."
            docker compose build reranker 2>&1 | tail -5
            docker compose build app 2>&1 | tail -5

            # Deploy
            echo "Starting containers..."
            docker compose up -d --remove-orphans 2>&1 | tail -5

            # Healthcheck with extended timeout for reranker cold start
            echo "Waiting for app (up to 120s)..."
            for i in $(seq 1 40); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/api/products?limit=1 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ App ready (${i}x3s)"
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "❌ App failed after 120s"
                docker compose logs app --tail=30 2>/dev/null || true
                exit 1
              fi
              sleep 3
            done

            # Verify reranker health
            echo "Checking reranker..."
            curl -sf http://localhost:8001/health && echo " ✅" || echo " ⚠️ Reranker still warming up (ok)"

            # Final cleanup
            docker image prune -f 2>/dev/null || true
            echo "=== Disk after deploy ==="
            df -h / | tail -1
            echo "✅ Deploy complete!"

      - name: Summary
        run: |
          echo "## ✅ Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ secrets.DEPLOY_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | 8090 |" >> $GITHUB_STEP_SUMMARY
          echo "| Reranker | 8001 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
