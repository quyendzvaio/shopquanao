name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  # ============================================================
  # Job 1: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit, phpcs

      - name: Validate composer
        run: composer validate --strict || echo "⚠️ composer.json not strict"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP Lint
        run: |
          ERRORS=0
          while IFS= read -r f; do
            php -l "$f" 2>/dev/null | grep -q "No syntax errors" || { echo "❌ $f"; ERRORS=$((ERRORS+1)); }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './test-evidence/*' \
            -not -path './reports/*' -not -path './.codex/*' -not -path './.git/*')
          [ "$ERRORS" -eq 0 ] && echo "✅ All PHP syntax OK" || exit 1

      - name: PHPCS (PSR-12)
        run: |
          vendor/bin/phpcs --standard=PSR12 --extensions=php \
            --ignore=test-evidence,reports,.codex,.agents,vendor,tests \
            --error-severity=1 --warning-severity=0 . || echo "⚠️ Style issues (non-blocking)"

      - name: Python syntax check (reranker)
        run: python3 -m py_compile docker/reranker/app.py && echo "✅ Python syntax OK"

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit --testsuite=Unit --colors=always --display-warnings
        env:
          APP_ENV: test

  # ============================================================
  # Job 3: Integration Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_pass
          MARIADB_DATABASE: shop_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -u root -proot_pass 2>/dev/null && break
            sleep 1
          done

      - name: Import schema
        run: mysql -h127.0.0.1 -u root -proot_pass shop_test < sql/shop_db.sql 2>/dev/null || echo "⚠️ Schema import skipped"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: shop_test
          DB_USER: root
          DB_PASS: root_pass
        run: vendor/bin/phpunit --testsuite=Integration --colors=always --display-warnings

  # ============================================================
  # Job 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for real secrets (API keys, tokens, private keys)..."
          # Only flag actual secret STRINGS — NOT PHP variable names like $password
          # Patterns:
          #   sk-[a-z0-9]{20,}     → API keys (sk-xxx...)
          #   AKIA[A-Z0-9]{16}     → AWS access keys
          #   -----BEGIN           → private keys
          #   ghp_xxx              → GitHub PAT
          #   github_pat_          → GitHub fine-grained PAT
          RESULTS=$(grep -rn 'sk-[a-z0-9]\{20,\}\|AKIA[A-Z0-9]\{16\}\|-----BEGIN[ A-Z]\{5,\}RSA\|ghp_\w\{36\}\|github_pat_\w\{82\}'             --include="*.php" --include="*.yml" --include="*.yaml"             --include="*.json" --include="*.sql" --include="*.md"             . 2>/dev/null |             grep -v "vendor/\|test-evidence/\|reports/\|\.git/\|node_modules/\|postman/\|\.github/" |             grep -v 'your-\|placeholder\|example\|sk-\.\.\.\|XXXXX\|test-\*' |             head -20 || true)
          if [ -n "$RESULTS" ]; then echo "❌ Secrets leaked:"; echo "$RESULTS"; exit 1
          else echo "✅ No secrets detected"; fi

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v $PWD:/src aquasecurity/trivy:latest fs             --severity HIGH,CRITICAL             --exit-code 0             --skip-dirs vendor,test-evidence,reports,.git,node_modules,postman             /src || echo "⚠️ Trivy scan completed (non-blocking)" 

  # ============================================================
  # Job 5: Docker Build
  # ============================================================
  docker:
    name: Docker Build
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build app image
        run: |
          docker build -t shop-quan-ao:ci-${{ github.sha }} .
          docker tag shop-quan-ao:ci-${{ github.sha }} shop-quan-ao:ci-latest

      # reranker image build skipped — Python deps too large for limited disk


      - name: Scan app image
        run: |
          docker run --rm aquasecurity/trivy:latest image             --severity HIGH,CRITICAL             --exit-code 0             shop-quan-ao:ci-${{ github.sha }} || echo "⚠️ Trivy scan done"

      - name: Scan reranker image
        run: |
          docker run --rm aquasecurity/trivy:latest image             --severity HIGH,CRITICAL             --exit-code 0             shop-quan-ao-reranker:ci-${{ github.sha }} || echo "⚠️ Trivy scan done" 

  # ============================================================
  # Job 6: Deploy to Production (main/master only)
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [unit-tests, integration-tests, security, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy via SSH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ secrets.DEPLOY_PATH }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: GITHUB_TOKEN,REPO
          script: |
            set -e
            REPO_PATH="$REPO"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            # Verify token
            echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
            if [ "${#GITHUB_TOKEN}" -lt 10 ]; then
              echo "❌ GITHUB_TOKEN missing — check secrets"
              exit 1
            fi

            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            # Free up disk space
            echo "Disk space before:"
            df -h / | tail -1
            docker system prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            echo "Disk space after:"
            df -h / | tail -1

            # Clone or pull repo
            if [ ! -d "$REPO_PATH" ]; then
              echo "Cloning ${{ github.repository }}..."
              git clone "$REPO_URL" "$REPO_PATH"
            fi

            cd "$REPO_PATH"
            git stash --include-untracked || true
            git remote set-url origin "$REPO_URL"

            # Detect default branch
            echo "Fetching remote..."
            git fetch origin 2>&1 || true
            DEFAULT_BRANCH=$(git remote show origin 2>/dev/null | grep "HEAD branch" | cut -d" " -f5 || echo "")
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH="main"
            fi
            echo "Branch: $DEFAULT_BRANCH"

            # Reset to remote
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"
            echo "✅ Repo: $(git rev-parse --short HEAD)"

            # Write .env
            echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'deepseek' }}" > .env
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> .env
            echo "LLM_BASE_URL=${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}" >> .env
            echo "LLM_MODEL=${{ secrets.LLM_MODEL || 'deepseek-chat' }}" >> .env
            echo "LLM_TIMEOUT=${{ secrets.LLM_TIMEOUT || '60' }}" >> .env
            echo "MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}" >> .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
            echo "PMA_PASSWORD=${{ secrets.PMA_PASSWORD || '' }}" >> .env
            echo "RERANKER_URL=" >> .env
            echo ".env written (\$(wc -l < .env) lines)"

            # Build app (single-stage, minimal deps — no reranker, saves >1GB disk)
            echo "Building app..."
            docker compose build --no-cache app 2>&1 | tail -5
            docker compose build --no-cache db 2>&1 | tail -3 || true

            # Deploy
            echo "Starting containers..."
            docker compose up -d --force-recreate --remove-orphans 2>&1 | tail -5

            # Healthcheck
            echo "Waiting for app..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/api/products?limit=1 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ App ready (${i}x3s)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ App failed after 90s"
                docker compose logs app --tail=20 2>/dev/null || true
                exit 1
              fi
              sleep 3
            done

            # Final cleanup
            docker image prune -f 2>/dev/null || true
            echo "✅ Deploy complete!"

      - name: Summary
        run: |
          echo "## ✅ Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ secrets.DEPLOY_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
